[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ansam-mcp-discovery"
version = "1.2.0"
description = "High-performance Model Context Protocol (MCP) Discovery Server with hybrid retrieval and dynamic proxy caching."
readme = "README.md"
authors = [
    { name = "Dagim Woldemareyam" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "mirascope>=2.4.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "qdrant_client>=1.17.1",
    "rank_bm25>=0.2.2",
    "torch>=2.0.0",
    "tqdm>=4.67.1",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]
